# Build and publish the multi-arch container image to GHCR.
#
# Triggers:
#   - push of version tags    -> tag the semver (e.g. 0.2.0, 0.2) + "latest"
#   - workflow_dispatch       -> manual run (tags from metadata-action)
#
# The push-to-main trigger is deliberately omitted — the tag push from
# release-please already covers every release, and branch-push builds
# were redundant with the tag build (two multi-arch builds for one merge).
# Use workflow_dispatch when you need a one-off `main` image.
#
# Version tags match BOTH conventions: `v0.2.0` (leading v) and bare `0.2.0`.
# The `push: tags` event fires on tag creation AND on tag force-update
# (re-pointing an existing tag); the `concurrency` group below cancels the
# superseded run so an updated tag rebuilds cleanly.
#
# The image is ghcr.io/soulwhisper/mcp-guardrails. Build args pass through
# PY_VERSION (defaults to 3.11-slim in the Dockerfile).
#
# Supply chain: buildx publishes SLSA provenance and an SBOM attestation
# alongside the image (`provenance: true`, `sbom: true` on the build step),
# and the pushed manifest is signed keylessly with cosign (Sigstore OIDC,
# `id-token: write`) by digest. Verify with:
#   cosign verify ghcr.io/soulwhisper/mcp-guardrails@<digest> \
#     --certificate-identity-regexp 'https://github.com/soulwhisper/mcp-guardrails' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# GitHub Releases are created manually via the GitHub UI (tag → Draft a new
# release); this workflow only builds/pushes the container image.
name: Docker publish

on:
  push:
    tags: ["v*", "[0-9]*"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing (Sigstore OIDC)

concurrency:
  # buildx only updates the image manifest atomically at the very end of the
  # build, so cancelling a superseded run mid-build leaves no partial manifest.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/soulwhisper/mcp-guardrails
          # On push of 1.2.3:   tag "1.2.3", "1.2", "latest"  (v1.2.3 also works)
          # On workflow_dispatch from main: tag "main"
          #
          # `type=semver` accepts a leading `v` OR a bare version, so both
          # `v0.2.0` and `0.2.0` produce `0.2.0` + `0.2`.
          # `latest` is enabled ONLY on tag pushes.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build & push (multi-arch, gha cache)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "HF_TOKEN=${{ secrets.HF_TOKEN }}"
          cache-from: type=gha

      - name: Generate image digest summary
        run: |
          echo "## Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing of the pushed manifest by digest. Runs on every
      # publish (tag push and workflow_dispatch both push the image).
      - name: Sign image (cosign keyless, by digest)
        run: cosign sign --yes ghcr.io/soulwhisper/mcp-guardrails@${{ steps.build.outputs.digest }}

      # ---------------------------------------------------------------------
      # Blocking security scan of the published image — runs only on tag
      # pushes (actual releases). workflow_dispatch builds are ad-hoc and
      # don't need the gate.
      #
      # exit-code: "1" makes any CRITICAL or HIGH finding fail the release
      # workflow. The image is already pushed (and signed) by this point, so
      # a failure signals the maintainer to triage and either patch or yank
      # the tag; ignore-unfixed drops findings with no available fix.
      #
      # trivy-action does not maintain floating major-version tags; pin to a
      # full release tag (currently the latest, v0.36.0).
      # ---------------------------------------------------------------------
      - name: Trivy scan of the published image
        if: github.ref_type == 'tag'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/soulwhisper/mcp-guardrails:latest
          format: table
          exit-code: "1" # fail the release on CRITICAL/HIGH findings
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
